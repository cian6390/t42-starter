services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: t42-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: t42
    volumes:
      - t42_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d t42"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  t42_postgres_data:
